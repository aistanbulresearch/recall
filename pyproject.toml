[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall-agent"
version = "0.1.0"
description = "Auditable non-clinical evidence-monitoring agent prototype"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "aistanbulresearch" }]
dependencies = [
  "google-adk==2.7.1",
  "google-cloud-aiplatform[agent_engines]==1.165.1",
  "google-cloud-firestore==2.28.1",
]

[dependency-groups]
dev = ["pytest>=9.0,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
